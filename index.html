<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Image Gallery</h1>
    <p>Click any image to view it larger</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="city">City</button>
    <button class="filter-btn" data-filter="animals">Animals</button>
  </div>

  <main class="gallery">
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800" alt="Mountain lake">
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Forest path">
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800" alt="Foggy hills">
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=800" alt="City skyline">
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800" alt="City street">
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800" alt="Night city">
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=800" alt="Small animal">
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=800" alt="Fox">
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800" alt="Dog">
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" id="close">&times;</button>
    <button class="nav prev" id="prev">&#10094;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="nav next" id="next">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
